<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAHASA — Curated Journeys & Travel Editorial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              display: ['"Playfair Display"', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              parchment: '#FDFBF7',
              sand: '#F5F1E9',
              sandDark: '#EDE7DB',
              ink: '#12161A',
              inkSoft: '#1F262D',
              slateSlate: '#2C5E7A',
              terracotta: {
                DEFAULT: '#C85A32',
                hover: '#B34D27',
                dark: '#9E3F1C',
              },
              taupe: {
                light: '#A39E96',
                DEFAULT: '#8A857D',
                dark: '#68635B',
              },
            },
          },
        },
      };
    </script>
    <style>
      ::selection {
        background: #C85A32;
        color: #FFFFFF;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F1E9;
      }
      ::-webkit-scrollbar-thumb {
        background: #D5CEC2;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8A857D;
      }
      .editorial-border {
        border-color: rgba(18, 22, 26, 0.08);
      }
      .editorial-border-light {
        border-color: rgba(255, 255, 255, 0.15);
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-parchment text-ink font-sans antialiased selection:bg-terracotta selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
